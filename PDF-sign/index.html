<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF ハンコ貼り付けアプリ</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #121212;
            color: #e0e0e0;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            background: #121212;
        }

        .toolbar {
            flex-shrink: 0;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            background: #1a1a1a;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 50;
        }

        .toolbar-group {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .toolbar-spacer {
            flex: 1;
            min-width: 8px;
        }

        .btn,
        .file-input-label {
            padding: 6px 10px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #333;
            color: #e0e0e0;
            line-height: 1;
            white-space: nowrap;
        }

        .btn:hover:not(:disabled),
        .file-input-label:hover {
            background: #444;
        }

        .btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .btn .material-icons,
        .file-input-label .material-icons {
            font-size: 18px;
        }

        .btn span:not(.material-icons),
        .file-input-label span:not(.material-icons) {
            display: none;
        }

        .btn-download {
            background: #1976d2;
            color: #fff;
        }

        .btn-download:hover:not(:disabled) {
            background: #1565c0;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .zoom-controls {
            display: none;
            align-items: center;
            gap: 2px;
            padding: 2px;
            background: #252525;
            border-radius: 6px;
        }

        .zoom-controls:not(.hidden) {
            display: inline-flex;
        }

        .zoom-btn {
            width: 32px;
            height: 32px;
            background: transparent;
            color: #e0e0e0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
            padding: 0;
        }

        .zoom-btn:hover {
            background: #3a3a3a;
        }

        .zoom-btn .material-icons {
            font-size: 18px;
        }

        .page-nav {
            display: none;
            align-items: center;
            gap: 2px;
        }

        .page-nav.visible {
            display: inline-flex;
        }

        .page-nav-info {
            font-size: 12px;
            color: #9e9e9e;
            min-width: 56px;
            text-align: center;
            user-select: none;
        }

        .status {
            font-size: 11px;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            order: 10;
            flex-basis: 100%;
            padding: 0 2px 2px;
        }

        @media (min-width: 900px) {
            .btn span:not(.material-icons),
            .file-input-label span:not(.material-icons) {
                display: inline;
            }

            .status {
                order: 0;
                flex-basis: auto;
                max-width: 280px;
                margin-left: 4px;
                padding: 0;
            }
        }

        .viewer-container {
            position: relative;
            flex: 1;
            min-height: 0;
            padding: 12px;
            background: #121212;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow: auto;
        }

        .viewer-container::before {
            content: 'PDF / ハンコ画像をドロップ';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #555;
            font-size: 15px;
            font-weight: 500;
            z-index: 1;
            pointer-events: none;
        }

        .viewer-container.has-pdf::before {
            display: none;
        }

        .viewer-container.drag-over {
            background: #1a1a1a;
            outline: 2px dashed #666;
            outline-offset: -8px;
        }

        .viewer-container.drag-over::before {
            content: 'ドロップしてください';
            color: #aaa;
            z-index: 1000;
        }

        .pdf-viewer {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
            overflow: visible;
        }

        .pdf-page {
            position: relative;
            background: #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
            overflow: visible;
            flex-shrink: 0;
        }

        .pdf-page canvas {
            display: block;
        }

        .page-label {
            position: absolute;
            top: 6px;
            left: 6px;
            background: rgba(0, 0, 0, 0.55);
            color: #eee;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 3px;
            pointer-events: none;
            z-index: 5;
        }

        .stamp-container {
            position: absolute;
            cursor: move;
            border: 2px dashed transparent;
            transition: border-color 0.15s;
            will-change: left, top, width, height;
            touch-action: none;
            z-index: 10;
        }

        .stamp-container.dragging,
        .stamp-container.resizing {
            transition: none;
            z-index: 20;
        }

        .stamp-container:hover {
            border-color: rgba(0, 0, 0, 0.25);
        }

        .stamp-container.selected {
            border-color: #1976d2;
            border-style: solid;
        }

        .stamp-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            user-select: none;
        }

        .resize-handle {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #1976d2;
            border: 2px solid #fff;
            border-radius: 50%;
            cursor: nwse-resize;
            z-index: 10;
            transition: background 0.15s, transform 0.15s;
        }

        .resize-handle:hover {
            background: #42a5f5;
            transform: scale(1.15);
        }

        .resize-handle.nw { top: -6px; left: -6px; cursor: nw-resize; }
        .resize-handle.ne { top: -6px; right: -6px; cursor: ne-resize; }
        .resize-handle.sw { bottom: -6px; left: -6px; cursor: sw-resize; }
        .resize-handle.se { bottom: -6px; right: -6px; cursor: se-resize; }
        .resize-handle.n { top: -6px; left: 50%; transform: translateX(-50%); cursor: n-resize; }
        .resize-handle.s { bottom: -6px; left: 50%; transform: translateX(-50%); cursor: s-resize; }
        .resize-handle.w { top: 50%; left: -6px; transform: translateY(-50%); cursor: w-resize; }
        .resize-handle.e { top: 50%; right: -6px; transform: translateY(-50%); cursor: e-resize; }

        .delete-btn {
            position: absolute;
            top: -12px;
            right: -12px;
            width: 24px;
            height: 24px;
            background: #333;
            color: #eee;
            border: 2px solid #fff;
            border-radius: 50%;
            padding: 0;
            cursor: pointer;
            line-height: 1;
            display: none;
            z-index: 100;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, transform 0.15s;
        }

        .delete-btn .material-icons {
            font-size: 16px;
        }

        .stamp-container.selected .delete-btn {
            display: flex;
        }

        .delete-btn:hover {
            background: #555;
            transform: scale(1.08);
        }

        .hidden {
            display: none !important;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #121212;
        }

        ::-webkit-scrollbar-thumb {
            background: #3a3a3a;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="toolbar">
            <div class="toolbar-group">
                <div class="file-input-wrapper">
                    <input type="file" id="pdfInput" accept=".pdf,application/pdf" />
                    <label for="pdfInput" class="file-input-label" title="PDFを選択">
                        <span class="material-icons">attach_file</span>
                        <span>PDF</span>
                    </label>
                </div>
                <div class="file-input-wrapper">
                    <input type="file" id="stampInput" accept="image/*,.svg,image/svg+xml" />
                    <label for="stampInput" class="file-input-label" title="ハンコ画像を選択（PNG/JPG/SVG）">
                        <span class="material-icons">brush</span>
                        <span>ハンコ</span>
                    </label>
                </div>
                <button class="btn" id="clearStampsBtn" title="ハンコを全て削除">
                    <span class="material-icons">delete_sweep</span>
                    <span>全削除</span>
                </button>
            </div>

            <div class="zoom-controls hidden" id="zoomControls">
                <button class="zoom-btn" id="zoomOutBtn" title="縮小">
                    <span class="material-icons">zoom_out</span>
                </button>
                <button class="zoom-btn" id="zoomInBtn" title="拡大">
                    <span class="material-icons">zoom_in</span>
                </button>
                <button class="zoom-btn" id="zoomFitBtn" title="横幅に合わせる">
                    <span class="material-icons">fit_screen</span>
                </button>
            </div>

            <div class="page-nav" id="pageNav">
                <button class="btn" id="prevPageBtn" title="前のページ">
                    <span class="material-icons">chevron_left</span>
                </button>
                <span class="page-nav-info" id="pageNavInfo">1 / 1</span>
                <button class="btn" id="nextPageBtn" title="次のページ">
                    <span class="material-icons">chevron_right</span>
                </button>
            </div>

            <span class="status" id="status">PDFを選択またはドロップ</span>

            <div class="toolbar-spacer"></div>

            <button class="btn btn-download" id="downloadBtn" title="PDFをダウンロード">
                <span class="material-icons">download</span>
                <span>ダウンロード</span>
            </button>
        </div>

        <div class="viewer-container" id="viewerContainer">
            <div id="pdfViewer" class="pdf-viewer"></div>
        </div>
    </div>

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- pdf-lib -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

    <script>
        // PDF.jsの設定
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let pdfDoc = null;
        let currentPage = 1;
        let pdfBytes = null;
        let pdfArrayBuffer = null;
        let pdfFile = null;
        let stamps = [];
        let selectedStamp = null;
        let isDragging = false;
        let isResizing = false;
        let dragOffset = { x: 0, y: 0 };
        let resizeHandle = null;
        let initialSize = { width: 0, height: 0 };
        let initialPos = { x: 0, y: 0 };
        let initialStampPos = { x: 0, y: 0 };
        let currentScale = 1.5;
        let manualScale = null; // 手動で設定したスケール（nullの場合は自動）
        let pageElements = new Map(); // pageNum -> { el, width, height }
        let activeDragEl = null;
        let activePageEl = null;
        let dragRafId = null;
        let pendingDragPoint = null;
        let resizeRafId = null;
        let pendingResizePoint = null;

        const pdfInput = document.getElementById('pdfInput');
        const stampInput = document.getElementById('stampInput');
        const downloadBtn = document.getElementById('downloadBtn');
        const clearStampsBtn = document.getElementById('clearStampsBtn');
        const viewerContainer = document.getElementById('viewerContainer');
        const pdfViewer = document.getElementById('pdfViewer');
        const status = document.getElementById('status');
        const zoomControls = document.getElementById('zoomControls');
        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomOutBtn = document.getElementById('zoomOutBtn');
        const zoomFitBtn = document.getElementById('zoomFitBtn');
        const pageNav = document.getElementById('pageNav');
        const pageNavInfo = document.getElementById('pageNavInfo');
        const prevPageBtn = document.getElementById('prevPageBtn');
        const nextPageBtn = document.getElementById('nextPageBtn');

        // PDF読み込み関数
        async function loadPDF(file) {
            if (!file) return;

            // ファイルオブジェクトを保持（後で再読み込み用）
            pdfFile = file;

            const reader = new FileReader();
            reader.onload = async (event) => {
                try {
                    const arrayBuffer = event.target.result;
                    // ArrayBufferをコピーして保持（detachedを防ぐ）
                    pdfArrayBuffer = arrayBuffer.slice(0);
                    // コピーしたArrayBufferからUint8Arrayを作成
                    pdfBytes = new Uint8Array(pdfArrayBuffer);
                    const loadingTask = pdfjsLib.getDocument({ data: pdfBytes });
                    pdfDoc = await loadingTask.promise;
                    currentPage = 1;
                    stamps = [];
                    selectedStamp = null;
                    viewerContainer.classList.add('has-pdf');
                    zoomControls.classList.remove('hidden');
                    manualScale = null; // デフォルトにリセット
                    updatePageNav();
                    await renderAllPages();
                    status.textContent = `PDFを読み込みました (${pdfDoc.numPages}ページ)`;
                } catch (error) {
                    status.textContent = 'PDFの読み込みに失敗しました: ' + error.message;
                    console.error(error);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // PDF読み込み
        pdfInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            await loadPDF(file);
        });

        // PDF座標系からピクセル座標に変換
        function pdfToPixel(pdfCoord, scale) {
            return pdfCoord * scale;
        }

        // ピクセル座標からPDF座標系に変換
        function pixelToPdf(pixelCoord, scale) {
            return pixelCoord / scale;
        }

        function updatePageNav() {
            if (!pdfDoc) {
                pageNav.classList.remove('visible');
                return;
            }
            pageNav.classList.toggle('visible', pdfDoc.numPages > 1);
            pageNavInfo.textContent = `${currentPage} / ${pdfDoc.numPages}`;
            prevPageBtn.disabled = currentPage <= 1;
            nextPageBtn.disabled = currentPage >= pdfDoc.numPages;
        }

        function getPageElement(pageNum) {
            return pageElements.get(pageNum)?.el || null;
        }

        function scrollToPage(pageNum, smooth = true) {
            const pageEl = getPageElement(pageNum);
            if (!pageEl) return;
            pageEl.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
        }

        function updateCurrentPageFromScroll() {
            if (!pdfDoc || pageElements.size === 0) return;
            const containerRect = viewerContainer.getBoundingClientRect();
            const focusY = containerRect.top + Math.min(120, containerRect.height * 0.25);
            let bestPage = currentPage;
            let bestDist = Infinity;

            pageElements.forEach((info, pageNum) => {
                const rect = info.el.getBoundingClientRect();
                const dist = Math.abs(rect.top - focusY);
                if (rect.bottom > containerRect.top && rect.top < containerRect.bottom && dist < bestDist) {
                    bestDist = dist;
                    bestPage = pageNum;
                }
            });

            if (bestPage !== currentPage) {
                currentPage = bestPage;
                updatePageNav();
            }
        }

        // 全ページレンダリング
        async function renderAllPages() {
            if (!pdfDoc) return;

            status.textContent = `PDFを描画中... (0 / ${pdfDoc.numPages})`;

            const firstPage = await pdfDoc.getPage(1);
            const baseViewport = firstPage.getViewport({ scale: 1.0 });
            const pageWidth = baseViewport.width;

            let scale;
            if (manualScale !== null) {
                scale = manualScale;
            } else {
                const containerRect = viewerContainer.getBoundingClientRect();
                const containerWidth = containerRect.width - 24;
                scale = containerWidth / pageWidth;
            }

            // スケールの範囲を制限（0.5倍～3倍）
            scale = Math.max(0.5, Math.min(scale, 3.0));
            currentScale = scale;

            pdfViewer.innerHTML = '';
            pdfViewer.style.width = '';
            pdfViewer.style.height = '';
            pageElements = new Map();

            for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
                const page = pageNum === 1 ? firstPage : await pdfDoc.getPage(pageNum);
                const viewport = page.getViewport({ scale: scale });

                const pageEl = document.createElement('div');
                pageEl.className = 'pdf-page';
                pageEl.dataset.page = String(pageNum);
                pageEl.style.width = viewport.width + 'px';
                pageEl.style.height = viewport.height + 'px';

                const label = document.createElement('div');
                label.className = 'page-label';
                label.textContent = `${pageNum} / ${pdfDoc.numPages}`;
                pageEl.appendChild(label);

                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                await page.render({
                    canvasContext: context,
                    viewport: viewport
                }).promise;

                pageEl.appendChild(canvas);
                pdfViewer.appendChild(pageEl);
                pageElements.set(pageNum, {
                    el: pageEl,
                    width: viewport.width,
                    height: viewport.height
                });

                if (pageNum === 1 || pageNum % 3 === 0 || pageNum === pdfDoc.numPages) {
                    status.textContent = `PDFを描画中... (${pageNum} / ${pdfDoc.numPages})`;
                }
            }

            // 既存のハンコを再配置
            stamps.forEach(stamp => addStampToViewer(stamp, scale));
            updatePageNav();

            // 現在ページへスクロール（再レンダリング時は即時）
            requestAnimationFrame(() => scrollToPage(currentPage, false));
            status.textContent = `PDFを表示中 (${pdfDoc.numPages}ページ) / ハンコ ${stamps.length}個`;
        }

        // 互換用エイリアス
        async function renderPage() {
            await renderAllPages();
        }

        function isSvgFile(file) {
            if (!file) return false;
            return file.type === 'image/svg+xml' || /\.svg$/i.test(file.name || '');
        }

        function isSvgDataUrl(dataUrl) {
            return typeof dataUrl === 'string' && /image\/svg\+xml/i.test(dataUrl);
        }

        function isImageFile(file) {
            if (!file) return false;
            return file.type.startsWith('image/') || isSvgFile(file);
        }

        // SVGはテキスト読み込みの方が互換性が高い
        function readFileAsImageData(file) {
            return new Promise((resolve, reject) => {
                if (isSvgFile(file)) {
                    const reader = new FileReader();
                    reader.onload = () => {
                        const text = String(reader.result || '');
                        const encoded = encodeURIComponent(text)
                            .replace(/'/g, '%27')
                            .replace(/"/g, '%22');
                        resolve({
                            dataUrl: `data:image/svg+xml;charset=utf-8,${encoded}`,
                            isSvg: true,
                            svgText: text
                        });
                    };
                    reader.onerror = () => reject(reader.error);
                    reader.readAsText(file);
                    return;
                }

                const reader = new FileReader();
                reader.onload = () => {
                    resolve({
                        dataUrl: reader.result,
                        isSvg: false,
                        svgText: null
                    });
                };
                reader.onerror = () => reject(reader.error);
                reader.readAsDataURL(file);
            });
        }

        function loadImageFromDataUrl(dataUrl) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => reject(new Error('画像の読み込みに失敗しました'));
                img.src = dataUrl;
            });
        }

        function parseSvgSize(svgText) {
            if (!svgText) return { width: 0, height: 0 };
            const viewBox = svgText.match(/viewBox\s*=\s*["']?\s*([-\d.]+)[,\s]+([-\d.]+)[,\s]+([-\d.]+)[,\s]+([-\d.]+)/i);
            if (viewBox) {
                return {
                    width: Math.abs(parseFloat(viewBox[3])) || 0,
                    height: Math.abs(parseFloat(viewBox[4])) || 0
                };
            }
            const w = svgText.match(/\bwidth\s*=\s*["']?([\d.]+)/i);
            const h = svgText.match(/\bheight\s*=\s*["']?([\d.]+)/i);
            return {
                width: w ? parseFloat(w[1]) : 0,
                height: h ? parseFloat(h[1]) : 0
            };
        }

        // pdf-libはSVG非対応のためPNGへラスタライズ
        async function rasterizeStampToPngBytes(stamp) {
            const img = stamp.image || await loadImageFromDataUrl(stamp.imageData);
            let srcW = img.naturalWidth || img.width || 0;
            let srcH = img.naturalHeight || img.height || 0;

            if ((!srcW || !srcH) && stamp.svgText) {
                const size = parseSvgSize(stamp.svgText);
                srcW = size.width;
                srcH = size.height;
            }
            if (!srcW || !srcH) {
                srcW = 512;
                srcH = 512;
            }

            const targetW = Math.max(256, Math.round(Math.max(srcW, stamp.pdfWidth * 4)));
            const targetH = Math.max(256, Math.round(targetW * (srcH / srcW)));

            const canvas = document.createElement('canvas');
            canvas.width = targetW;
            canvas.height = targetH;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, targetW, targetH);
            ctx.drawImage(img, 0, 0, targetW, targetH);

            const pngDataUrl = canvas.toDataURL('image/png');
            return dataURLToUint8Array(pngDataUrl);
        }

        async function embedStampImage(pdfDocLib, stamp) {
            if (stamp.isSvg || isSvgDataUrl(stamp.imageData)) {
                const pngBytes = await rasterizeStampToPngBytes(stamp);
                return pdfDocLib.embedPng(pngBytes);
            }

            const imageBytes = dataURLToUint8Array(stamp.imageData);
            const mimeType = stamp.imageData.match(/data:image\/([^;,]+)/);
            if (mimeType) {
                const format = mimeType[1].toLowerCase();
                if (format === 'png') {
                    return pdfDocLib.embedPng(imageBytes);
                }
                if (format === 'jpeg' || format === 'jpg') {
                    return pdfDocLib.embedJpg(imageBytes);
                }
                if (format.includes('svg')) {
                    const pngBytes = await rasterizeStampToPngBytes(stamp);
                    return pdfDocLib.embedPng(pngBytes);
                }
            }
            // 不明形式はPNGとして試行、失敗時はラスタライズ
            try {
                return await pdfDocLib.embedPng(imageBytes);
            } catch (_) {
                const pngBytes = await rasterizeStampToPngBytes(stamp);
                return pdfDocLib.embedPng(pngBytes);
            }
        }

        // ハンコ画像読み込み関数
        async function loadStamp(file) {
            if (!file) return false;

            if (!pdfDoc) {
                status.textContent = 'まずPDFを読み込んでください';
                return false;
            }

            if (!isImageFile(file)) {
                status.textContent = '画像ファイル（PNG/JPG/SVG）を選択してください';
                return false;
            }

            try {
                const { dataUrl, isSvg, svgText } = await readFileAsImageData(file);
                const img = await loadImageFromDataUrl(dataUrl);

                updateCurrentPageFromScroll();

                let aspect = 1;
                const natW = img.naturalWidth || img.width;
                const natH = img.naturalHeight || img.height;
                if (natW > 0 && natH > 0) {
                    aspect = natW / natH;
                } else if (svgText) {
                    const size = parseSvgSize(svgText);
                    if (size.width > 0 && size.height > 0) {
                        aspect = size.width / size.height;
                    }
                }

                const initialPdfWidth = 150 / currentScale;
                const initialPdfHeight = initialPdfWidth / aspect;
                const initialPdfX = 100 / currentScale;
                const initialPdfY = 100 / currentScale;

                const stamp = {
                    id: Date.now() + Math.random(),
                    image: img,
                    imageData: dataUrl,
                    isSvg,
                    svgText,
                    pdfX: initialPdfX,
                    pdfY: initialPdfY,
                    pdfWidth: initialPdfWidth,
                    pdfHeight: initialPdfHeight,
                    x: 0,
                    y: 0,
                    width: 0,
                    height: 0,
                    page: currentPage
                };
                stamps.push(stamp);
                addStampToViewer(stamp, currentScale);
                status.textContent = `${currentPage}ページ目にハンコを追加${isSvg ? '（SVG）' : ''}`;
                return true;
            } catch (error) {
                console.error(error);
                status.textContent = 'ハンコ画像の読み込みに失敗しました';
                return false;
            }
        }

        // ハンコ画像読み込み
        stampInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            await loadStamp(file);
            // 同じファイルを再選択できるようにする
            e.target.value = '';
        });

        // 削除ボタンの位置を調整
        function updateDeleteButtonPosition(container) {
            const deleteBtn = container.querySelector('.delete-btn');
            if (!deleteBtn) return;
            deleteBtn.style.top = '-15px';
            deleteBtn.style.right = '-15px';
        }

        // ハンコをビューアに追加
        function addStampToViewer(stamp, scale) {
            const pageInfo = pageElements.get(stamp.page);
            if (!pageInfo) return;

            // PDF座標系からピクセル座標に変換
            stamp.x = pdfToPixel(stamp.pdfX, scale);
            stamp.y = pdfToPixel(stamp.pdfY, scale);
            stamp.width = pdfToPixel(stamp.pdfWidth, scale);
            stamp.height = pdfToPixel(stamp.pdfHeight, scale);

            const container = document.createElement('div');
            container.className = 'stamp-container';
            container.dataset.stampId = stamp.id;
            container.style.left = stamp.x + 'px';
            container.style.top = stamp.y + 'px';
            container.style.width = stamp.width + 'px';
            container.style.height = stamp.height + 'px';

            const img = document.createElement('img');
            img.src = stamp.imageData;
            img.className = 'stamp-image';
            img.draggable = false;
            container.appendChild(img);

            // 削除ボタン
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            const closeIcon = document.createElement('span');
            closeIcon.className = 'material-icons';
            closeIcon.textContent = 'close';
            deleteBtn.appendChild(closeIcon);
            deleteBtn.onclick = (e) => {
                e.stopPropagation();
                removeStamp(stamp.id);
            };
            container.appendChild(deleteBtn);
            updateDeleteButtonPosition(container);

            // リサイズハンドル
            const handles = ['nw', 'ne', 'sw', 'se', 'n', 's', 'w', 'e'];
            handles.forEach(handle => {
                const handleEl = document.createElement('div');
                handleEl.className = `resize-handle ${handle}`;
                handleEl.dataset.handle = handle;
                container.appendChild(handleEl);
            });

            // クリックで選択
            container.addEventListener('click', (e) => {
                if (e.target.classList.contains('resize-handle') || e.target.classList.contains('delete-btn')) return;
                selectStamp(stamp.id);
                currentPage = stamp.page;
                updatePageNav();
            });

            // ドラッグ開始
            container.addEventListener('pointerdown', (e) => {
                if (e.button !== undefined && e.button !== 0) return;
                if (e.target.classList.contains('resize-handle')) {
                    startResize(e, container, stamp, pageInfo.el);
                } else if (!e.target.closest('.delete-btn')) {
                    startDrag(e, container, stamp, pageInfo.el);
                }
            });

            pageInfo.el.appendChild(container);
            selectStamp(stamp.id);
        }

        // ハンコ選択
        function selectStamp(stampId) {
            document.querySelectorAll('.stamp-container').forEach(el => {
                el.classList.remove('selected');
            });

            const container = document.querySelector(`[data-stamp-id="${stampId}"]`);
            if (container) {
                container.classList.add('selected');
                selectedStamp = stamps.find(s => s.id === stampId);
            }
        }

        // ドラッグ開始
        function startDrag(e, container, stamp, pageEl) {
            isDragging = true;
            selectedStamp = stamp;
            activeDragEl = container;
            activePageEl = pageEl;
            selectStamp(stamp.id);
            currentPage = stamp.page;
            updatePageNav();

            container.classList.add('dragging');

            const rect = container.getBoundingClientRect();
            dragOffset.x = e.clientX - rect.left;
            dragOffset.y = e.clientY - rect.top;

            // pointer capture で要素外でも追従。イベントは capture 先に届くので要素側で購読
            container.addEventListener('pointermove', handleDrag, { passive: false });
            container.addEventListener('pointerup', stopDrag);
            container.addEventListener('pointercancel', stopDrag);
            try {
                container.setPointerCapture(e.pointerId);
            } catch (_) { /* ignore */ }
            e.preventDefault();
        }

        function applyDragPosition(clientX, clientY) {
            if (!isDragging || !selectedStamp || !activeDragEl || !activePageEl) return;

            const pageRect = activePageEl.getBoundingClientRect();
            let x = clientX - pageRect.left - dragOffset.x;
            let y = clientY - pageRect.top - dragOffset.y;

            const pageW = activePageEl.offsetWidth;
            const pageH = activePageEl.offsetHeight;

            x = Math.max(0, Math.min(x, pageW - selectedStamp.width));
            y = Math.max(0, Math.min(y, pageH - selectedStamp.height));

            selectedStamp.x = x;
            selectedStamp.y = y;
            activeDragEl.style.left = x + 'px';
            activeDragEl.style.top = y + 'px';
        }

        // ドラッグ処理（rAFで描画を間引きつつ最新位置を反映）
        function handleDrag(e) {
            if (!isDragging || !selectedStamp) return;
            e.preventDefault();
            pendingDragPoint = { x: e.clientX, y: e.clientY };
            if (dragRafId !== null) return;
            dragRafId = requestAnimationFrame(() => {
                dragRafId = null;
                if (!pendingDragPoint) return;
                applyDragPosition(pendingDragPoint.x, pendingDragPoint.y);
            });
        }

        // ドラッグ終了
        function stopDrag() {
            if (dragRafId !== null) {
                cancelAnimationFrame(dragRafId);
                dragRafId = null;
            }
            if (pendingDragPoint) {
                applyDragPosition(pendingDragPoint.x, pendingDragPoint.y);
                pendingDragPoint = null;
            }

            if (selectedStamp) {
                selectedStamp.pdfX = pixelToPdf(selectedStamp.x, currentScale);
                selectedStamp.pdfY = pixelToPdf(selectedStamp.y, currentScale);
            }

            if (activeDragEl) {
                activeDragEl.classList.remove('dragging');
                activeDragEl.removeEventListener('pointermove', handleDrag);
                activeDragEl.removeEventListener('pointerup', stopDrag);
                activeDragEl.removeEventListener('pointercancel', stopDrag);
            }

            isDragging = false;
            activeDragEl = null;
            activePageEl = null;
        }

        // リサイズ開始
        function startResize(e, container, stamp, pageEl) {
            isResizing = true;
            selectedStamp = stamp;
            activeDragEl = container;
            activePageEl = pageEl;
            resizeHandle = e.target.dataset.handle;
            currentPage = stamp.page;
            updatePageNav();
            selectStamp(stamp.id);

            container.classList.add('resizing');

            const rect = container.getBoundingClientRect();
            initialPos.x = e.clientX;
            initialPos.y = e.clientY;
            initialSize.width = rect.width;
            initialSize.height = rect.height;
            initialStampPos.x = stamp.x;
            initialStampPos.y = stamp.y;

            container.addEventListener('pointermove', handleResize, { passive: false });
            container.addEventListener('pointerup', stopResize);
            container.addEventListener('pointercancel', stopResize);
            try {
                container.setPointerCapture(e.pointerId);
            } catch (_) { /* ignore */ }
            e.preventDefault();
            e.stopPropagation();
        }

        function applyResize(clientX, clientY) {
            if (!isResizing || !selectedStamp || !activeDragEl || !activePageEl) return;

            const deltaX = clientX - initialPos.x;
            const deltaY = clientY - initialPos.y;
            
            let newWidth = initialSize.width;
            let newHeight = initialSize.height;
            let newX = initialStampPos.x;
            let newY = initialStampPos.y;

            const minSize = 30;
            const aspectRatio = initialSize.width / initialSize.height;
            const pageW = activePageEl.offsetWidth;
            const pageH = activePageEl.offsetHeight;

            switch (resizeHandle) {
                case 'se':
                    newWidth = Math.max(minSize, initialSize.width + deltaX);
                    newHeight = newWidth / aspectRatio;
                    break;
                case 'sw':
                    newWidth = Math.max(minSize, initialSize.width - deltaX);
                    newHeight = newWidth / aspectRatio;
                    newX = initialStampPos.x + (initialSize.width - newWidth);
                    break;
                case 'ne':
                    newWidth = Math.max(minSize, initialSize.width + deltaX);
                    newHeight = newWidth / aspectRatio;
                    newY = initialStampPos.y + (initialSize.height - newHeight);
                    break;
                case 'nw':
                    newWidth = Math.max(minSize, initialSize.width - deltaX);
                    newHeight = newWidth / aspectRatio;
                    newX = initialStampPos.x + (initialSize.width - newWidth);
                    newY = initialStampPos.y + (initialSize.height - newHeight);
                    break;
                case 'e':
                    newWidth = Math.max(minSize, initialSize.width + deltaX);
                    newHeight = newWidth / aspectRatio;
                    break;
                case 'w':
                    newWidth = Math.max(minSize, initialSize.width - deltaX);
                    newHeight = newWidth / aspectRatio;
                    newX = initialStampPos.x + (initialSize.width - newWidth);
                    break;
                case 's':
                    newHeight = Math.max(minSize, initialSize.height + deltaY);
                    newWidth = newHeight * aspectRatio;
                    break;
                case 'n':
                    newHeight = Math.max(minSize, initialSize.height - deltaY);
                    newWidth = newHeight * aspectRatio;
                    newY = initialStampPos.y + (initialSize.height - newHeight);
                    break;
            }

            if (newX < 0) {
                newWidth += newX;
                newX = 0;
                newHeight = newWidth / aspectRatio;
            }
            if (newY < 0) {
                newHeight += newY;
                newY = 0;
                newWidth = newHeight * aspectRatio;
            }
            if (newX + newWidth > pageW) {
                newWidth = pageW - newX;
                newHeight = newWidth / aspectRatio;
            }
            if (newY + newHeight > pageH) {
                newHeight = pageH - newY;
                newWidth = newHeight * aspectRatio;
            }
            if (newWidth < minSize || newHeight < minSize) return;

            selectedStamp.width = newWidth;
            selectedStamp.height = newHeight;
            selectedStamp.x = newX;
            selectedStamp.y = newY;

            activeDragEl.style.width = newWidth + 'px';
            activeDragEl.style.height = newHeight + 'px';
            activeDragEl.style.left = newX + 'px';
            activeDragEl.style.top = newY + 'px';
        }

        // リサイズ処理
        function handleResize(e) {
            if (!isResizing || !selectedStamp) return;
            e.preventDefault();
            pendingResizePoint = { x: e.clientX, y: e.clientY };
            if (resizeRafId !== null) return;
            resizeRafId = requestAnimationFrame(() => {
                resizeRafId = null;
                if (!pendingResizePoint) return;
                applyResize(pendingResizePoint.x, pendingResizePoint.y);
            });
        }

        // リサイズ終了
        function stopResize() {
            if (resizeRafId !== null) {
                cancelAnimationFrame(resizeRafId);
                resizeRafId = null;
            }
            if (pendingResizePoint) {
                applyResize(pendingResizePoint.x, pendingResizePoint.y);
                pendingResizePoint = null;
            }

            if (selectedStamp) {
                selectedStamp.pdfX = pixelToPdf(selectedStamp.x, currentScale);
                selectedStamp.pdfY = pixelToPdf(selectedStamp.y, currentScale);
                selectedStamp.pdfWidth = pixelToPdf(selectedStamp.width, currentScale);
                selectedStamp.pdfHeight = pixelToPdf(selectedStamp.height, currentScale);
            }

            if (activeDragEl) {
                activeDragEl.classList.remove('resizing');
                activeDragEl.removeEventListener('pointermove', handleResize);
                activeDragEl.removeEventListener('pointerup', stopResize);
                activeDragEl.removeEventListener('pointercancel', stopResize);
            }

            isResizing = false;
            resizeHandle = null;
            activeDragEl = null;
            activePageEl = null;
        }

        // ハンコ削除
        function removeStamp(stampId) {
            stamps = stamps.filter(s => s.id !== stampId);
            const container = document.querySelector(`[data-stamp-id="${stampId}"]`);
            if (container) {
                container.remove();
            }
            if (selectedStamp && selectedStamp.id === stampId) {
                selectedStamp = null;
            }
            status.textContent = 'ハンコを削除しました';
        }

        // 全てのハンコ削除
        clearStampsBtn.addEventListener('click', () => {
            stamps = [];
            selectedStamp = null;
            document.querySelectorAll('.stamp-container').forEach(el => el.remove());
            status.textContent = '全てのハンコを削除しました';
        });

        // Data URLからBase64データを抽出
        function dataURLToUint8Array(dataURL) {
            const base64 = dataURL.split(',')[1];
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return bytes;
        }

        // PDFダウンロード
        downloadBtn.addEventListener('click', async () => {
            if (!pdfDoc || !pdfFile) {
                status.textContent = 'PDFを読み込んでください';
                return;
            }

            if (stamps.length === 0) {
                status.textContent = 'ハンコが追加されていません';
                return;
            }

            try {
                status.textContent = 'PDFを生成中...';
                // ファイルから再度読み込んで確実にArrayBufferを取得（detachedを防ぐ）
                const fileArrayBuffer = await pdfFile.arrayBuffer();
                const pdfDocLib = await PDFLib.PDFDocument.load(fileArrayBuffer);
                const pages = pdfDocLib.getPages();

                // 各ページのハンコを追加
                for (let pageNum = 1; pageNum <= pages.length; pageNum++) {
                    const pageStamps = stamps.filter(s => s.page === pageNum);
                    if (pageStamps.length === 0) continue;

                    const page = pages[pageNum - 1];
                    const { width: pageWidth, height: pageHeight } = page.getSize();

                    for (const stamp of pageStamps) {
                        try {
                            const image = await embedStampImage(pdfDocLib, stamp);

                            // PDF座標系を直接使用（PDFは左下が原点）
                            const x = stamp.pdfX;
                            const y = pageHeight - (stamp.pdfY + stamp.pdfHeight);
                            const width = stamp.pdfWidth;
                            const height = stamp.pdfHeight;

                            page.drawImage(image, {
                                x: x,
                                y: y,
                                width: width,
                                height: height,
                            });
                        } catch (stampError) {
                            console.error(`ハンコ ${stamp.id} の処理エラー:`, stampError);
                            status.textContent = `ハンコの埋め込みでエラーが発生しました`;
                        }
                    }
                }

                const modifiedPdfBytes = await pdfDocLib.save();
                const blob = new Blob([modifiedPdfBytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                // 元のファイル名を使用
                a.download = pdfFile.name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                status.textContent = 'PDFをダウンロードしました！';
            } catch (error) {
                status.textContent = 'エラー: ' + error.message;
                console.error('PDF生成エラー:', error);
            }
        });

        // ビューア外クリックで選択解除
        viewerContainer.addEventListener('click', (e) => {
            if (
                e.target === viewerContainer ||
                e.target === pdfViewer ||
                e.target.tagName === 'CANVAS' ||
                e.target.classList.contains('pdf-page') ||
                e.target.classList.contains('page-label')
            ) {
                document.querySelectorAll('.stamp-container').forEach(el => {
                    el.classList.remove('selected');
                });
                selectedStamp = null;
            }
        });

        // スクロールで現在ページを更新
        viewerContainer.addEventListener('scroll', () => {
            if (!isDragging && !isResizing) {
                updateCurrentPageFromScroll();
            }
        }, { passive: true });

        // ページ送り
        prevPageBtn.addEventListener('click', () => {
            if (!pdfDoc || currentPage <= 1) return;
            currentPage -= 1;
            updatePageNav();
            scrollToPage(currentPage);
        });

        nextPageBtn.addEventListener('click', () => {
            if (!pdfDoc || currentPage >= pdfDoc.numPages) return;
            currentPage += 1;
            updatePageNav();
            scrollToPage(currentPage);
        });

        // ドラッグ&ドロップ機能
        viewerContainer.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
            viewerContainer.classList.add('drag-over');
        });

        viewerContainer.addEventListener('dragleave', (e) => {
            e.preventDefault();
            e.stopPropagation();
            // 子要素への移動時はdrag-overを維持
            if (!viewerContainer.contains(e.relatedTarget)) {
                viewerContainer.classList.remove('drag-over');
            }
        });

        viewerContainer.addEventListener('drop', async (e) => {
            e.preventDefault();
            e.stopPropagation();
            viewerContainer.classList.remove('drag-over');

            const files = Array.from(e.dataTransfer.files);
            
            for (const file of files) {
                if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
                    await loadPDF(file);
                    const dataTransfer = new DataTransfer();
                    dataTransfer.items.add(file);
                    pdfInput.files = dataTransfer.files;
                } else if (isImageFile(file)) {
                    await loadStamp(file);
                    const dataTransfer = new DataTransfer();
                    dataTransfer.items.add(file);
                    stampInput.files = dataTransfer.files;
                }
            }
        });

        // ドラッグ開始時のデフォルト動作を無効化（ページ全体）
        document.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        document.addEventListener('drop', (e) => {
            e.preventDefault();
        });

        // ウィンドウリサイズ時にPDFを再レンダリング（手動スケールでない場合のみ）
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (pdfDoc && manualScale === null) {
                    renderAllPages();
                }
            }, 250);
        });

        // 拡大ボタン
        zoomInBtn.addEventListener('click', () => {
            if (!pdfDoc) return;
            manualScale = currentScale * 1.2;
            renderAllPages();
        });

        // 縮小ボタン
        zoomOutBtn.addEventListener('click', () => {
            if (!pdfDoc) return;
            manualScale = currentScale * 0.8;
            renderAllPages();
        });

        // 横幅に合わせるボタン
        zoomFitBtn.addEventListener('click', () => {
            if (!pdfDoc) return;
            manualScale = null; // 自動スケールに戻す
            renderAllPages();
        });
    </script>
</body>
</html>
